<!DOCTYPE html>
<html lang="my" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မှတ်တမ်းစာရင်း (Records)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
        button, a {
            touch-action: manipulation;
        }
        .overflow-y-auto, .overflow-x-auto {
            -webkit-overflow-scrolling: touch;
        }

        /* ===== Live Ticker Marquee Animation ===== */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            animation: marquee 18s linear infinite;
        }
        #tickerBar:hover .animate-marquee {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14 sm:h-16 gap-2">
                <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                    <a href="/" class="p-2 rounded-md hover:bg-indigo-500 focus:outline-none shrink-0">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <span class="font-bold text-sm sm:text-xl tracking-tight truncate">
                        <i class="fas fa-list-ol mr-2"></i> မှတ်တမ်းစာရင်း (Records)
                    </span>
                </div>
                <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                    <div class="text-xs sm:text-sm font-medium bg-indigo-500 px-2 sm:px-3 py-1 rounded-full shadow-inner whitespace-nowrap">
                        <span id="recCount">0</span> records
                    </div>
                    <div class="flex items-center gap-2 bg-indigo-950 px-3 py-1 rounded-lg shadow-inner">
                        <div class="text-center">
                            <div class="text-[10px] text-indigo-300 font-semibold leading-none mb-0.5">🇲🇲 Myanmar</div>
                            <div id="clockMyanmar" class="text-sm sm:text-base font-mono font-bold text-emerald-400 tracking-widest whitespace-nowrap leading-tight">--:--:-- --</div>
                        </div>
                        <div class="w-px h-8 bg-indigo-600"></div>
                        <div class="text-center">
                            <div class="text-[10px] text-indigo-300 font-semibold leading-none mb-0.5">🇹🇭 Thailand</div>
                            <div id="clockThailand" class="text-sm sm:text-base font-mono font-bold text-amber-400 tracking-widest whitespace-nowrap leading-tight">--:--:-- --</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Live Ticker -->
    <div id="tickerBar" class="bg-slate-800 text-emerald-300 overflow-hidden whitespace-nowrap shadow-md">
        <div id="tickerContent" class="inline-block py-2 px-4 text-sm sm:text-base font-bold tracking-wide animate-marquee">
            Thai 2D Live Result: <span id="tickerResult" class="text-white font-extrabold">--</span>
            &nbsp;&nbsp;|&nbsp;&nbsp; SET: <span id="tickerSet" class="text-white font-extrabold">--</span>
            &nbsp;&nbsp;|&nbsp;&nbsp; VALUE: <span id="tickerValue" class="text-white font-extrabold">--</span>
            &nbsp;&nbsp;|&nbsp;&nbsp; Updating Live...
        </div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 w-full">
        <div class="bg-white rounded-xl shadow-md p-3 sm:p-4 border border-gray-100">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-table mr-2 text-indigo-500"></i> မှတ်တမ်းအားလုံး</h2>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <div class="flex items-center flex-1 sm:flex-none border border-gray-300 rounded-lg bg-white overflow-hidden focus-within:ring-1 focus-within:ring-indigo-500">
                        <span class="px-2 text-gray-400"><i class="fas fa-search"></i></span>
                        <input id="searchInput" type="text" placeholder="Search (နာမည်/နံပါတ်/Formula)..." class="w-full sm:w-72 p-2 outline-none text-sm">
                    </div>
                    <select id="typeFilter" class="flex-1 sm:flex-none border border-gray-300 rounded-lg p-2 text-sm">
                        <option value="">အားလုံး (All)</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <div class="max-h-[70vh] overflow-y-auto border border-gray-200 rounded-lg">
                    <table class="min-w-full text-sm">
                        <thead class="sticky top-0 bg-gray-50 text-gray-600 z-10">
                            <tr class="border-b">
                                <th class="text-center px-3 py-2 font-bold w-14">စဉ်</th>
                                <th class="text-left px-3 py-2 font-bold">ထိုးသူအမည်</th>
                                <th class="text-left px-3 py-2 font-bold">ဂဏန်း</th>
                                <th class="text-left px-3 py-2 font-bold">Formula</th>
                                <th class="text-right px-3 py-2 font-bold">ငွေပမာဏ</th>
                                <th class="text-left px-3 py-2 font-bold">အချိန်</th>
                                <th class="text-right px-3 py-2 font-bold">စုစုပေါင်းငွေပမာဏ</th>
                            </tr>
                        </thead>
                        <tbody id="recordsBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-200 text-sm">
                <span class="text-gray-500">Showing <span id="showCount">0</span> / <span id="totalCount">0</span></span>
                <span class="font-bold text-indigo-700">စုစုပေါင်း: <span id="grandTotal">0</span> Ks</span>
            </div>
        </div>
    </main>

    <script>
        // ===== Dual Digital Clocks (Myanmar & Thailand) =====
        function formatTime12(timezone) {
            const now = new Date();
            const options = {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            return now.toLocaleTimeString('en-US', options);
        }
        function updateClocks() {
            document.getElementById('clockMyanmar').textContent = formatTime12('Asia/Yangon');
            document.getElementById('clockThailand').textContent = formatTime12('Asia/Bangkok');
        }
        updateClocks();
        setInterval(updateClocks, 1000);

        // ===== Live Ticker Data Simulation =====
        const tickerData = {
            result: '59',
            set: '1,452.34',
            value: '35,678.90'
        };
        function updateTicker() {
            document.getElementById('tickerResult').textContent = tickerData.result;
            document.getElementById('tickerSet').textContent = tickerData.set;
            document.getElementById('tickerValue').textContent = tickerData.value;
        }
        updateTicker();
        setInterval(() => {
            const base = parseFloat(tickerData.set.replace(/,/g, ''));
            tickerData.set = (base + (Math.random() - 0.5) * 10).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            const vbase = parseFloat(tickerData.value.replace(/,/g, ''));
            tickerData.value = (vbase + (Math.random() - 0.5) * 100).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            updateTicker();
        }, 5000);

        const RECORDS = {{ records_json|safe }};

        function numText(nums) {
            const s = (nums || []).join(', ');
            return s.length > 80 ? s.slice(0, 80) + '...' : (s || '-');
        }

        function render() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const type = document.getElementById('typeFilter').value;
            const body = document.getElementById('recordsBody');
            body.innerHTML = '';
            let shown = 0;
            let grand = 0;

            RECORDS.slice().reverse().forEach((r) => {
                if (type && r.formula !== type) return;
                if (q) {
                    const hay = `${r.formula} ${r.original} ${r.bettor_name || ''} ${(r.numbers || []).join(' ')} ${r.id}`.toLowerCase();
                    if (!hay.includes(q)) return;
                }
                shown++;
                const total = r.count * r.amount;
                if (!r.is_error) grand += r.amount * r.count;

                const tr = document.createElement('tr');
                tr.className = r.is_error ? 'bg-red-50' : 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="px-3 py-2 text-center font-semibold text-gray-700">${r.id}</td>
                    <td class="px-3 py-2 font-medium text-indigo-700">${r.is_error ? 'Invalid' : (r.bettor_name || '—')}${r.formula ? `<div class="text-[11px] text-gray-400 font-normal">${r.formula}${r.bettor_date ? ' · ' + r.bettor_date : ''}</div>` : ''}</td>
                    <td class="px-3 py-2 text-gray-700 max-w-xs truncate" title="${(r.numbers || []).join(', ')}">${numText(r.numbers)}</td>
                    <td class="px-3 py-2 font-mono text-gray-600 max-w-[180px] truncate" title="${r.original}">${r.original}</td>
                    <td class="px-3 py-2 text-right font-bold ${r.is_error ? 'text-gray-400' : 'text-green-700'}">${r.amount.toLocaleString()}</td>
                    <td class="px-3 py-2 text-gray-500">${r.time}</td>
                    <td class="px-3 py-2 text-right font-bold ${r.is_error ? 'text-gray-400' : 'text-gray-800'}">${r.is_error ? '—' : total.toLocaleString()}</td>
                `;
                body.appendChild(tr);
            });

            document.getElementById('showCount').textContent = shown;
            document.getElementById('totalCount').textContent = RECORDS.length;
            document.getElementById('grandTotal').textContent = grand.toLocaleString();
            document.getElementById('recCount').textContent = RECORDS.length;
        }

        document.getElementById('searchInput').addEventListener('input', render);

        document.getElementById('typeFilter').addEventListener('change', render);

        (function init() {
            const types = [...new Set(RECORDS.map((r) => r.formula).filter(Boolean))].sort();
            const sel = document.getElementById('typeFilter');
            types.forEach((t) => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                sel.appendChild(opt);
            });
            render();
        })();
    </script>
</body>
</html>
