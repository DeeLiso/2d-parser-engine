<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            margin: 0; padding: 0;
            overscroll-behavior: none;
            height: 100dvh;
            height: -webkit-fill-available;
        }
        html { height: 100dvh; height: -webkit-fill-available; }
        #chatBox {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .chat-input-bar {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .msg-mine { background: #2563eb; color: white; border-radius: 1rem 1rem 0.25rem 1rem; }
        .msg-other { background: white; color: #1f2937; border-radius: 1rem 1rem 1rem 0.25rem; border: 1px solid #e5e7eb; }
        .msg-pinned { border-left: 3px solid #f59e0b !important; }
        .msg-actions { opacity: 0; transition: opacity 0.15s; }
        .msg-wrap:hover .msg-actions,
        .msg-wrap:active .msg-actions { opacity: 1; }
        .emoji-btn { transition: transform 0.1s; }
        .emoji-btn:active { transform: scale(1.3); }
        #reactPicker {
            position: fixed;
            z-index: 100;
            max-width: calc(100vw - 16px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .msg-photo {
            max-width: 220px;
            border-radius: 0.5rem;
            cursor: pointer;
            display: block;
        }
        #photoPreview {
            max-height: 120px;
            border-radius: 0.5rem;
            object-fit: cover;
        }
        @media (min-width: 640px) {
            #chatBox { padding: 1rem 1rem; }
            .msg-photo { max-width: 300px; }
        }
    </style>
</head>
<body class="flex flex-col h-full">
    <input type="hidden" id="csrfToken" value="{{ csrf_token }}">
    <input type="hidden" id="chatRole" value="{{ chat_role }}">
    <input type="file" id="photoInput" accept="image/*" class="hidden">

    <!-- Navbar -->
    <nav class="text-white shadow-lg sticky top-0 z-50 shrink-0 {% if chat_role == 'player' %}bg-emerald-600{% else %}bg-indigo-600{% endif %}">
        <div class="max-w-3xl mx-auto px-2 sm:px-4 h-11 sm:h-12 flex items-center gap-2 sm:gap-3">
            <a href="{% if chat_role == 'player' %}/bet/?type=bettor{% else %}/bet/?type=dealer{% endif %}" class="text-white hover:text-white/80 w-8 h-8 flex items-center justify-center shrink-0">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            {% if chat_role == 'player' %}
            <span class="font-bold text-xs sm:text-sm truncate"><i class="fas fa-comments mr-1"></i> Player Chat</span>
            <span class="ml-auto flex items-center gap-1.5 text-[10px] bg-emerald-700 px-2 py-0.5 rounded-full shrink-0">
                <i class="fas fa-user-circle"></i> <span id="senderName"></span>
            </span>
            {% else %}
            <span class="font-bold text-xs sm:text-sm truncate"><i class="fas fa-comments mr-1"></i> Owner Chat</span>
            <button id="clearChatBtn" class="ml-auto w-8 h-8 rounded-lg bg-indigo-700 hover:bg-red-600 text-white flex items-center justify-center transition shrink-0" title="Clear All Messages">
                <i class="fas fa-trash-alt text-xs"></i>
            </button>
            <span class="flex items-center gap-1.5 text-[10px] bg-indigo-700 px-2 py-0.5 rounded-full shrink-0">
                <i class="fas fa-crown"></i> <span id="senderName"></span>
            </span>
            {% endif %}
        </div>
    </nav>

    <!-- Pinned Section -->
    <div id="pinnedSection" class="hidden bg-amber-50 border-b border-amber-200 px-3 sm:px-4 py-2 shrink-0 max-w-3xl mx-auto w-full">
        <div class="flex items-center gap-2 mb-1">
            <i class="fas fa-thumbtack text-amber-500 text-xs shrink-0"></i>
            <span class="text-[11px] sm:text-xs font-bold text-amber-700 shrink-0">Pinned</span>
            <div id="pinnedList" class="flex-1 overflow-x-auto whitespace-nowrap space-x-2 scrollbar-hide"></div>
            <button id="closePinned" class="ml-1 text-amber-400 hover:text-amber-600 text-xs shrink-0 w-6 h-6 flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chatBox" class="flex-1 overflow-y-auto px-2 sm:px-4 py-2 sm:py-3 max-w-3xl mx-auto w-full"></div>

    <!-- Photo Preview -->
    <div id="photoPreviewWrap" class="hidden bg-white border-t border-gray-200 px-3 py-2 max-w-3xl mx-auto w-full shrink-0">
        <div class="relative inline-block">
            <img id="photoPreview" src="" alt="">
            <button id="removePhoto" class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center shadow"><i class="fas fa-times"></i></button>
        </div>
        <input id="captionInput" type="text" placeholder="Caption (optional)..."
            class="mt-2 w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400">
    </div>

    <!-- Input -->
    <div class="chat-input-bar bg-white border-t border-gray-200 px-2 sm:px-3 py-2 shrink-0">
        <div class="max-w-3xl mx-auto flex items-center gap-1.5 sm:gap-2">
            <button id="photoBtn" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition shrink-0" title="Send Photo">
                <i class="fas fa-camera text-sm"></i>
            </button>
            <input id="chatInput" type="text" placeholder="Message..."
                class="flex-1 border border-gray-300 rounded-full px-3 sm:px-4 py-2 text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 min-w-0">
            <button id="chatSend" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full {% if chat_role == 'player' %}bg-emerald-600 hover:bg-emerald-700{% else %}bg-indigo-600 hover:bg-indigo-700{% endif %} text-white flex items-center justify-center transition shrink-0">
                <i class="fas fa-paper-plane text-xs sm:text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Photo Modal -->
    <div id="photoModal" class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center cursor-zoom-out" onclick="this.classList.add('hidden')">
        <img id="photoModalImg" src="" class="max-w-[95vw] max-h-[90vh] rounded-lg">
    </div>

    <script>
        const CSRF = document.getElementById('csrfToken').value;
        const chatRole = document.getElementById('chatRole').value;
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const photoInput = document.getElementById('photoInput');
        const photoPreviewWrap = document.getElementById('photoPreviewWrap');
        const photoPreview = document.getElementById('photoPreview');
        const captionInput = document.getElementById('captionInput');
        const isOwner = chatRole === 'owner';
        let lastId = 0;
        let myType = chatRole;
        let myName = '';
        let allMessages = {};
        let pendingPhoto = null;

        const EMOJIS = ['👍','❤️','😂','😮','😢','🔥','💯','🙏'];

        async function apiPost(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        async function apiGet(url) {
            const res = await fetch(url, { headers: { 'X-CSRFToken': CSRF } });
            return res.json();
        }

        function renderReactions(msgId, reactions) {
            if (!reactions || !Object.keys(reactions).length) return '';
            let html = '<div class="flex flex-wrap gap-1 mt-1">';
            for (const [emoji, info] of Object.entries(reactions)) {
                const iMy = info.users.includes(myType + ':' + myName);
                const bg = iMy ? 'bg-blue-100 border-blue-300' : 'bg-gray-100 border-gray-200';
                html += `<button onclick="toggleReact(${msgId},'${emoji}')" class="emoji-btn inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full text-[11px] border ${bg} hover:bg-blue-50">
                    <span>${emoji}</span><span class="font-bold">${info.count}</span>
                </button>`;
            }
            html += '</div>';
            return html;
        }

        function renderMsg(m) {
            const isMine = m.sender_type === myType;
            const cls = isMine ? 'msg-mine ml-auto' : 'msg-other mr-auto';
            const nameColor = isMine ? (myType === 'player' ? 'text-emerald-200' : 'text-indigo-200') : 'text-gray-400';
            const icon = m.sender_type === 'owner' ? '<i class="fas fa-crown mr-0.5"></i>' : '<i class="fas fa-user-circle mr-0.5"></i>';
            const pinCls = m.is_pinned ? 'msg-pinned' : '';
            const pinBtn = isOwner ? `<button onclick="togglePin(${m.id})" class="msg-actions text-[10px] w-5 h-5 flex items-center justify-center ${m.is_pinned ? 'text-amber-400' : 'text-gray-400 hover:text-amber-400'}" title="${m.is_pinned ? 'Unpin' : 'Pin'}">
                <i class="fas fa-thumbtack"></i></button>` : '';
            const reactBtn = `<button onclick="showReactPicker(event,${m.id})" class="msg-actions text-[10px] w-5 h-5 flex items-center justify-center text-gray-400 hover:text-blue-400" title="React">
                <i class="fas fa-smile"></i></button>`;
            const pinLabel = m.is_pinned ? '<span class="text-[9px] text-amber-500 font-bold"><i class="fas fa-thumbtack mr-0.5"></i>Pinned</span>' : '';
            const photoHtml = m.photo ? `<img src="${m.photo}" class="msg-photo mb-1" onclick="showPhotoModal('${m.photo}')" loading="lazy">` : '';
            const msgHtml = m.message ? `<div class="text-[13px] sm:text-sm leading-snug break-words">${m.message}</div>` : '';

            return `<div class="msg-wrap max-w-[85%] sm:max-w-[80%] ${cls} px-3 py-2 mb-2 shadow-sm ${pinCls}" data-msgid="${m.id}">
                <div class="flex items-center gap-0.5">
                    <div class="text-[10px] font-bold ${nameColor} mb-0.5 flex-1 min-w-0 truncate">${icon}${m.sender_name} · ${m.time}</div>
                    ${pinBtn}${reactBtn}
                </div>
                ${pinLabel}
                ${photoHtml}
                ${msgHtml}
                ${renderReactions(m.id, m.reactions)}
            </div>`;
        }

        function renderAll() {
            const pinnedMsgs = Object.values(allMessages).filter(m => m.is_pinned);
            const pinnedSection = document.getElementById('pinnedSection');
            const pinnedList = document.getElementById('pinnedList');

            if (pinnedMsgs.length) {
                pinnedSection.classList.remove('hidden');
                pinnedList.innerHTML = pinnedMsgs.map(m => {
                    const icon = m.sender_type === 'owner' ? '<i class="fas fa-crown mr-0.5"></i>' : '<i class="fas fa-user-circle mr-0.5"></i>';
                    return `<span class="inline-block text-[11px] text-amber-800 truncate max-w-[200px]">${icon}<b>${m.sender_name}</b>: ${m.message || '📷 Photo'}</span>`;
                }).join('');
            } else {
                pinnedSection.classList.add('hidden');
            }

            chatBox.innerHTML = '';
            const sorted = Object.values(allMessages).sort((a, b) => a.id - b.id);
            for (const m of sorted) {
                chatBox.insertAdjacentHTML('beforeend', renderMsg(m));
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showReactPicker(e, msgId) {
            e.stopPropagation();
            closeReactPicker();
            const picker = document.createElement('div');
            picker.id = 'reactPicker';
            picker.className = 'bg-white rounded-xl shadow-xl border border-gray-200 px-2 py-1.5 flex gap-1';
            const rect = e.target.getBoundingClientRect();
            let top = rect.top - 48;
            if (top < 8) top = rect.bottom + 6;
            let left = rect.left - 60;
            if (left < 8) left = 8;
            if (left + 200 > window.innerWidth) left = window.innerWidth - 208;
            picker.style.top = top + 'px';
            picker.style.left = left + 'px';
            for (const em of EMOJIS) {
                const btn = document.createElement('button');
                btn.textContent = em;
                btn.className = 'emoji-btn text-lg hover:scale-125 transition p-0.5';
                btn.onclick = (ev) => { ev.stopPropagation(); toggleReact(msgId, em); closeReactPicker(); };
                picker.appendChild(btn);
            }
            document.body.appendChild(picker);
        }

        function closeReactPicker() {
            const old = document.getElementById('reactPicker');
            if (old) old.remove();
        }
        document.addEventListener('click', closeReactPicker);

        function showPhotoModal(src) {
            document.getElementById('photoModalImg').src = src;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        async function togglePin(msgId) {
            const d = await apiPost('/api/chat/pin', { id: msgId });
            if (d.ok && allMessages[msgId]) {
                allMessages[msgId].is_pinned = d.is_pinned;
                renderAll();
            }
        }

        async function toggleReact(msgId, emoji) {
            const d = await apiPost('/api/chat/react', { id: msgId, emoji: emoji });
            if (d.ok && allMessages[msgId]) {
                allMessages[msgId].reactions = d.reactions;
                renderAll();
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text && !pendingPhoto) return;
            if (pendingPhoto) {
                await uploadPhoto();
                return;
            }
            chatInput.value = '';
            await apiPost('/api/chat/send', { message: text });
            poll();
        }

        async function uploadPhoto() {
            if (!pendingPhoto) return;
            const fd = new FormData();
            fd.append('photo', pendingPhoto);
            fd.append('caption', captionInput.value.trim());
            const sendBtn = document.getElementById('chatSend');
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i>';
            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/chat/upload_photo', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': CSRF },
                    body: fd
                });
                const d = await res.json();
                if (d.ok) {
                    clearPhoto();
                    poll();
                } else {
                    alert(d.error || 'Upload failed');
                }
            } catch(e) {
                alert('Upload failed');
            }
            sendBtn.innerHTML = '<i class="fas fa-paper-plane text-xs sm:text-sm"></i>';
            sendBtn.disabled = false;
        }

        function clearPhoto() {
            pendingPhoto = null;
            photoInput.value = '';
            photoPreviewWrap.classList.add('hidden');
            captionInput.value = '';
        }

        document.getElementById('photoBtn').addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Max 5MB'); photoInput.value = ''; return; }
            pendingPhoto = file;
            const reader = new FileReader();
            reader.onload = (ev) => { photoPreview.src = ev.target.result; photoPreviewWrap.classList.remove('hidden'); };
            reader.readAsDataURL(file);
        });
        document.getElementById('removePhoto').addEventListener('click', clearPhoto);

        async function poll() {
            const data = await apiGet('/api/chat/poll?after=' + lastId);
            if (data.ok && data.messages.length) {
                for (const m of data.messages) {
                    allMessages[m.id] = m;
                    lastId = Math.max(lastId, m.id);
                }
                renderAll();
            }
        }

        document.getElementById('chatSend').addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

        const clearBtn = document.getElementById('clearChatBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', async () => {
                if (!confirm('Chat messages အားလုံး ဖျက်မလား?')) return;
                await apiPost('/api/chat/clear', {});
                allMessages = {};
                lastId = 0;
                renderAll();
            });
        }

        document.getElementById('closePinned').addEventListener('click', () => {
            document.getElementById('pinnedSection').classList.add('hidden');
        });

        (async function init() {
            if (myType === 'player') {
                try {
                    const res = await fetch('/api/bettor_profile', { headers: { 'X-CSRFToken': CSRF } });
                    const d = await res.json();
                    if (d.ok) myName = d.account.username;
                    else myName = 'Player';
                } catch(e) { myName = 'Player'; }
            } else {
                myName = 'Owner';
            }
            document.getElementById('senderName').textContent = myName;
            poll();
        })();

        setInterval(poll, 3000);
    </script>
</body>
</html>
