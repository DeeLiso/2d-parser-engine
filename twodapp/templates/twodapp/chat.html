<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/effects.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100dvh; height: -webkit-fill-available; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overscroll-behavior: none;
        }

        /* ===== Glass Nav ===== */
        .glass-nav {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* ===== Pinned Banner ===== */
        .pinned-banner {
            background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(245,158,11,0.05));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(251,191,36,0.15);
        }
        .pinned-banner .pin-icon {
            width: 22px; height: 22px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(245,158,11,0.3);
        }

        /* ===== Message Bubbles ===== */
        .msg-mine {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 1.25rem 1.25rem 0.3rem 1.25rem;
            box-shadow: 0 4px 15px rgba(102,126,234,0.35);
        }
        .msg-other {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            border-radius: 1.25rem 1.25rem 1.25rem 0.3rem;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .msg-pinned { border-left: 3px solid #fbbf24 !important; }

        /* ===== Chat Box ===== */
        #chatBox {
            flex: 1; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-bottom: 100px;
        }

        /* ===== Floating Input ===== */
        .chat-input-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
            padding: 0 8px calc(env(safe-area-inset-bottom, 0px) + 8px) 8px;
        }
        .chat-input-inner {
            max-width: 48rem; margin: 0 auto;
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 9999px;
            padding: 6px 6px 6px 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .chat-input-inner input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #e2e8f0; font-size: 0.875rem; padding: 6px 4px; min-width: 0;
        }
        .chat-input-inner input::placeholder { color: rgba(255,255,255,0.4); }
        .input-glow {
            width: 36px; height: 36px; min-width: 36px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: all 0.15s ease;
        }
        .input-glow:active { transform: scale(0.9); }
        .cam-btn { background: rgba(255,255,255,0.15); }
        .cam-btn:hover { background: rgba(255,255,255,0.25); }
        .send-btn-owner { background: linear-gradient(135deg, #667eea, #764ba2); box-shadow: 0 2px 12px rgba(102,126,234,0.5); }
        .send-btn-player { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 2px 12px rgba(56,239,125,0.4); }

        /* ===== Actions & Hover ===== */
        .msg-actions { opacity: 0; transition: opacity 0.15s; }
        .msg-wrap:hover .msg-actions,
        .msg-wrap:active .msg-actions { opacity: 1; }

        /* ===== Quick React Bar ===== */
        .quick-react-bar {
            position: absolute; top: -36px; right: 0;
            display: flex; gap: 2px;
            background: rgba(30,27,75,0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 9999px;
            padding: 3px 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            opacity: 0; transform: translateY(4px) scale(0.9);
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 10;
        }
        .msg-wrap:hover .quick-react-bar,
        .msg-wrap.show-react .quick-react-bar {
            opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
        }
        .quick-react-bar button {
            width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent;
            font-size: 15px; cursor: pointer; transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .quick-react-bar button:active { transform: scale(1.4); }

        /* ===== Full React Picker ===== */
        #reactPicker {
            position: fixed; z-index: 100;
            max-width: calc(100vw - 16px);
            flex-wrap: wrap; justify-content: center;
            background: rgba(30,27,75,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            padding: 6px 8px;
        }

        /* ===== Reaction Chips ===== */
        .react-chip {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #cbd5e1;
        }
        .react-chip.active {
            background: rgba(99,102,241,0.3);
            border-color: rgba(99,102,241,0.5);
            color: #a5b4fc;
        }
        .emoji-btn { transition: transform 0.1s; }
        .emoji-btn:active { transform: scale(1.3); }

        /* ===== Reply Banner ===== */
        .reply-banner {
            background: rgba(99,102,241,0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 3px solid #818cf8;
            border-radius: 0 0.5rem 0.5rem 0;
            animation: slideDown 0.2s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Typing Indicator ===== */
        .typing-dots { display: flex; gap: 3px; align-items: center; }
        .typing-dots span {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255,255,255,0.5);
            animation: typingPulse 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* ===== Online Status Dot ===== */
        .online-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34,197,94,0.6);
            animation: onlinePulse 2s infinite;
        }
        @keyframes onlinePulse {
            0%, 100% { box-shadow: 0 0 4px rgba(34,197,94,0.4); }
            50% { box-shadow: 0 0 10px rgba(34,197,94,0.8); }
        }

        /* ===== Photo ===== */
        .msg-photo { max-width: 220px; border-radius: 0.75rem; cursor: pointer; display: block; }
        #photoPreview { max-height: 120px; border-radius: 0.75rem; object-fit: cover; }
        .glass-photo-preview {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .glass-photo-preview input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0;
        }
        .glass-photo-preview input::placeholder { color: rgba(255,255,255,0.4); }

        @media (min-width: 640px) {
            #chatBox { padding-left: 1rem; padding-right: 1rem; }
            .msg-photo { max-width: 300px; }
        }
    </style>
</head>
<body class="flex flex-col h-full">
    <input type="hidden" id="csrfToken" value="{{ csrf_token }}">
    <input type="hidden" id="chatRole" value="{{ chat_role }}">
    <input type="file" id="photoInput" accept="image/*" class="hidden">

    <!-- Navbar -->
    <nav class="glass-nav text-white sticky top-0 z-50 shrink-0">
        <div class="max-w-3xl mx-auto px-2 sm:px-4 h-11 sm:h-12 flex items-center gap-2 sm:gap-3">
            <a href="{% if chat_role == 'player' %}/bet/?type=bettor{% else %}/bet/?type=dealer{% endif %}" class="text-white/70 hover:text-white w-8 h-8 flex items-center justify-center shrink-0 transition">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            {% if chat_role == 'player' %}
            <span class="font-bold text-xs sm:text-sm truncate"><i class="fas fa-comments mr-1 text-emerald-400"></i> Player Chat</span>
            <div class="ml-auto flex items-center gap-2">
                <span class="flex items-center gap-1.5 text-[10px] text-emerald-400/70"><span class="online-dot"></span> Online</span>
                <span class="flex items-center gap-1.5 text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full shrink-0">
                    <i class="fas fa-user-circle"></i> <span id="senderName"></span>
                </span>
            </div>
            {% else %}
            <span class="font-bold text-xs sm:text-sm truncate"><i class="fas fa-comments mr-1 text-indigo-400"></i> Owner Chat</span>
            <div class="ml-auto flex items-center gap-2">
                <div id="typingIndicator" class="hidden items-center gap-1.5 text-[10px] text-white/50">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                    <span class="typing-text">Player typing...</span>
                </div>
                <button id="clearChatBtn" class="btn-fx ripple w-8 h-8 rounded-lg bg-white/10 hover:bg-red-500/30 text-white/70 hover:text-red-400 flex items-center justify-center transition shrink-0" title="Clear All Messages">
                    <i class="fas fa-trash-alt text-xs"></i>
                </button>
                <span class="flex items-center gap-1.5 text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 px-2 py-0.5 rounded-full shrink-0">
                    <i class="fas fa-crown text-amber-400"></i> <span id="senderName"></span>
                </span>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- Pinned Banner -->
    <div id="pinnedSection" class="hidden pinned-banner px-3 sm:px-4 py-2 shrink-0 max-w-3xl mx-auto w-full">
        <div class="flex items-center gap-2">
            <div class="pin-icon shrink-0"><i class="fas fa-thumbtack text-[9px] text-white"></i></div>
            <div class="flex-1 min-w-0">
                <div class="text-[10px] font-bold text-amber-400/80 mb-0.5">Pinned Message</div>
                <div id="pinnedText" class="text-[11px] text-white/70 truncate"></div>
            </div>
            <button id="closePinned" class="text-white/30 hover:text-white/70 text-xs shrink-0 w-6 h-6 flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chatBox" class="flex-1 overflow-y-auto px-2 sm:px-4 py-2 sm:py-3 max-w-3xl mx-auto w-full"></div>

    <!-- Photo Preview -->
    <div id="photoPreviewWrap" class="hidden glass-photo-preview px-3 py-2 shrink-0">
        <div class="relative inline-block">
            <img id="photoPreview" src="" alt="">
            <button id="removePhoto" class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center shadow"><i class="fas fa-times"></i></button>
        </div>
        <input id="captionInput" type="text" placeholder="Caption (optional)..."
            class="mt-2 w-full rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400/50">
    </div>

    <!-- Reply Banner (hidden by default) -->
    <div id="replyBanner" class="hidden reply-banner px-3 sm:px-4 py-2 shrink-0 max-w-3xl mx-auto w-full">
        <div class="flex items-center gap-2">
            <i class="fas fa-reply text-indigo-400 text-[11px] shrink-0"></i>
            <div class="flex-1 min-w-0">
                <div class="text-[10px] font-bold text-indigo-400/80" id="replyToName"></div>
                <div class="text-[11px] text-white/60 truncate" id="replyToText"></div>
            </div>
            <button id="cancelReply" class="text-white/30 hover:text-white/70 text-xs shrink-0 w-5 h-5 flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Floating Input -->
    <div class="chat-input-bar">
        <div class="chat-input-inner">
            <button id="photoBtn" class="input-glow cam-btn" title="Send Photo">
                <i class="fas fa-camera text-sm"></i>
            </button>
            <input id="chatInput" type="text" placeholder="Type a message...">
            <button id="chatSend" class="input-glow {% if chat_role == 'player' %}send-btn-player{% else %}send-btn-owner{% endif %}">
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Photo Modal -->
    <div id="photoModal" class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center cursor-zoom-out" onclick="this.classList.add('hidden')">
        <img id="photoModalImg" src="" class="max-w-[95vw] max-h-[90vh] rounded-xl shadow-2xl">
    </div>

    <script>
        const CSRF = document.getElementById('csrfToken').value;
        const chatRole = document.getElementById('chatRole').value;
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const photoInput = document.getElementById('photoInput');
        const photoPreviewWrap = document.getElementById('photoPreviewWrap');
        const photoPreview = document.getElementById('photoPreview');
        const captionInput = document.getElementById('captionInput');
        const replyBanner = document.getElementById('replyBanner');
        const isOwner = chatRole === 'owner';
        let lastId = 0;
        let myType = chatRole;
        let myName = '';
        let allMessages = {};
        let pendingPhoto = null;
        let replyingTo = null;

        const EMOJIS = ['👍','❤️','😂','😮','😢','🔥','💯','🙏'];

        async function apiPost(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        async function apiGet(url) {
            const res = await fetch(url, { headers: { 'X-CSRFToken': CSRF } });
            return res.json();
        }

        function renderReactions(msgId, reactions) {
            if (!reactions || !Object.keys(reactions).length) return '';
            let html = '<div class="flex flex-wrap gap-1 mt-1.5">';
            for (const [emoji, info] of Object.entries(reactions)) {
                const iMy = info.users.includes(myType + ':' + myName);
                html += `<button onclick="toggleReact(${msgId},'${emoji}')" class="emoji-btn inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] react-chip ${iMy ? 'active' : ''}">
                    <span>${emoji}</span><span class="font-bold">${info.count}</span>
                </button>`;
            }
            html += '</div>';
            return html;
        }

        function renderMsg(m) {
            const isMine = m.sender_type === myType;
            const cls = isMine ? 'msg-mine ml-auto' : 'msg-other mr-auto';
            const nameColor = isMine ? 'text-white/70' : 'text-white/50';
            const icon = m.sender_type === 'owner' ? '<i class="fas fa-crown mr-0.5 text-amber-400"></i>' : '<i class="fas fa-user-circle mr-0.5 text-emerald-400"></i>';
            const pinCls = m.is_pinned ? 'msg-pinned' : '';
            const pinBtn = isOwner ? `<button onclick="event.stopPropagation();togglePin(${m.id})" class="msg-actions text-[10px] w-5 h-5 flex items-center justify-center ${m.is_pinned ? 'text-amber-400' : 'text-white/40 hover:text-amber-400'}" title="${m.is_pinned ? 'Unpin' : 'Pin'}">
                <i class="fas fa-thumbtack"></i></button>` : '';
            const reactBtn = `<button onclick="event.stopPropagation();showReactPicker(event,${m.id})" class="msg-actions text-[10px] w-5 h-5 flex items-center justify-center text-white/40 hover:text-indigo-300" title="React">
                <i class="fas fa-smile"></i></button>`;
            const replyBtn = `<button onclick="event.stopPropagation();startReply(${m.id})" class="msg-actions text-[10px] w-5 h-5 flex items-center justify-center text-white/40 hover:text-cyan-300" title="Reply">
                <i class="fas fa-reply"></i></button>`;
            const pinLabel = m.is_pinned ? '<span class="text-[9px] text-amber-400 font-bold"><i class="fas fa-thumbtack mr-0.5"></i>Pinned</span>' : '';
            const photoHtml = m.photo ? `<img src="${m.photo}" class="msg-photo mb-1" onclick="showPhotoModal('${m.photo}')" loading="lazy">` : '';
            const msgHtml = m.message ? `<div class="text-[13px] sm:text-sm leading-snug break-words">${m.message}</div>` : '';

            const quickReact = `<div class="quick-react-bar">
                <button onclick="event.stopPropagation();quickReact(${m.id},'👍')">👍</button>
                <button onclick="event.stopPropagation();quickReact(${m.id},'❤️')">❤️</button>
                <button onclick="event.stopPropagation();quickReact(${m.id},'🔥')">🔥</button>
                <button onclick="event.stopPropagation();showReactPicker(event,${m.id})" style="font-size:12px;color:rgba(255,255,255,0.5);">⋯</button>
            </div>`;

            return `<div class="msg-wrap max-w-[85%] sm:max-w-[80%] ${cls} px-3.5 py-2.5 mb-2.5 ${pinCls} relative" data-msgid="${m.id}">
                ${quickReact}
                <div class="flex items-center gap-0.5">
                    <div class="text-[10px] font-bold ${nameColor} mb-0.5 flex-1 min-w-0 truncate">${icon}${m.sender_name} · ${m.time}</div>
                    ${pinBtn}${reactBtn}${replyBtn}
                </div>
                ${pinLabel}
                ${photoHtml}
                ${msgHtml}
                ${renderReactions(m.id, m.reactions)}
            </div>`;
        }

        function renderAll() {
            const pinnedMsgs = Object.values(allMessages).filter(m => m.is_pinned);
            const pinnedSection = document.getElementById('pinnedSection');
            const pinnedText = document.getElementById('pinnedText');

            if (pinnedMsgs.length) {
                const latest = pinnedMsgs[pinnedMsgs.length - 1];
                const icon = latest.sender_type === 'owner' ? '👑' : '🟢';
                pinnedSection.classList.remove('hidden');
                pinnedText.textContent = `${icon} ${latest.sender_name}: ${latest.message || '📷 Photo'}`;
            } else {
                pinnedSection.classList.add('hidden');
            }

            chatBox.innerHTML = '';
            const sorted = Object.values(allMessages).sort((a, b) => a.id - b.id);
            for (const m of sorted) {
                chatBox.insertAdjacentHTML('beforeend', renderMsg(m));
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* ===== Quick React ===== */
        async function quickReact(msgId, emoji) {
            const d = await apiPost('/api/chat/react', { id: msgId, emoji: emoji });
            if (d.ok && allMessages[msgId]) {
                allMessages[msgId].reactions = d.reactions;
                renderAll();
            }
        }

        /* ===== Full React Picker ===== */
        function showReactPicker(e, msgId) {
            e.stopPropagation();
            closeReactPicker();
            const picker = document.createElement('div');
            picker.id = 'reactPicker';
            const rect = e.target.getBoundingClientRect();
            let top = rect.top - 48;
            if (top < 8) top = rect.bottom + 6;
            let left = rect.left - 60;
            if (left < 8) left = 8;
            if (left + 200 > window.innerWidth) left = window.innerWidth - 208;
            picker.style.top = top + 'px';
            picker.style.left = left + 'px';
            for (const em of EMOJIS) {
                const btn = document.createElement('button');
                btn.textContent = em;
                btn.className = 'emoji-btn text-lg hover:scale-125 transition p-0.5';
                btn.onclick = (ev) => { ev.stopPropagation(); toggleReact(msgId, em); closeReactPicker(); };
                picker.appendChild(btn);
            }
            document.body.appendChild(picker);
        }

        function closeReactPicker() {
            const old = document.getElementById('reactPicker');
            if (old) old.remove();
        }
        document.addEventListener('click', closeReactPicker);

        /* ===== Reply ===== */
        function startReply(msgId) {
            const m = allMessages[msgId];
            if (!m) return;
            replyingTo = msgId;
            const icon = m.sender_type === 'owner' ? '👑' : '🟢';
            document.getElementById('replyToName').textContent = `${icon} ${m.sender_name}`;
            document.getElementById('replyToText').textContent = m.message || '📷 Photo';
            replyBanner.classList.remove('hidden');
            chatInput.focus();
        }

        document.getElementById('cancelReply').addEventListener('click', () => {
            replyingTo = null;
            replyBanner.classList.add('hidden');
        });

        /* ===== Photo Modal ===== */
        function showPhotoModal(src) {
            document.getElementById('photoModalImg').src = src;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        /* ===== Pin & React ===== */
        async function togglePin(msgId) {
            const d = await apiPost('/api/chat/pin', { id: msgId });
            if (d.ok && allMessages[msgId]) {
                allMessages[msgId].is_pinned = d.is_pinned;
                renderAll();
            }
        }

        async function toggleReact(msgId, emoji) {
            const d = await apiPost('/api/chat/react', { id: msgId, emoji: emoji });
            if (d.ok && allMessages[msgId]) {
                allMessages[msgId].reactions = d.reactions;
                renderAll();
            }
        }

        /* ===== Send Message ===== */
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text && !pendingPhoto) return;
            if (pendingPhoto) { await uploadPhoto(); return; }
            chatInput.value = '';
            let payload = { message: text };
            if (replyingTo && allMessages[replyingTo]) {
                const rm = allMessages[replyingTo];
                payload.reply_to = replyingTo;
                payload.message = `↩️ @${rm.sender_name}: ${rm.message || '📷 Photo'}\n\n${text}`;
            }
            replyingTo = null;
            replyBanner.classList.add('hidden');
            await apiPost('/api/chat/send', payload);
            poll();
        }

        /* ===== Upload Photo ===== */
        async function uploadPhoto() {
            if (!pendingPhoto) return;
            const fd = new FormData();
            fd.append('photo', pendingPhoto);
            fd.append('caption', captionInput.value.trim());
            const sendBtn = document.getElementById('chatSend');
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i>';
            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/chat/upload_photo', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': CSRF },
                    body: fd
                });
                const d = await res.json();
                if (d.ok) { clearPhoto(); poll(); }
                else { alert(d.error || 'Upload failed'); }
            } catch(e) { alert('Upload failed'); }
            sendBtn.innerHTML = '<i class="fas fa-paper-plane text-xs sm:text-sm"></i>';
            sendBtn.disabled = false;
        }

        function clearPhoto() {
            pendingPhoto = null;
            photoInput.value = '';
            photoPreviewWrap.classList.add('hidden');
            captionInput.value = '';
        }

        document.getElementById('photoBtn').addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Max 5MB'); photoInput.value = ''; return; }
            pendingPhoto = file;
            const reader = new FileReader();
            reader.onload = (ev) => { photoPreview.src = ev.target.result; photoPreviewWrap.classList.remove('hidden'); };
            reader.readAsDataURL(file);
        });
        document.getElementById('removePhoto').addEventListener('click', clearPhoto);

        /* ===== Poll ===== */
        async function poll() {
            const data = await apiGet('/api/chat/poll?after=' + lastId);
            if (data.ok && data.messages.length) {
                for (const m of data.messages) {
                    allMessages[m.id] = m;
                    lastId = Math.max(lastId, m.id);
                }
                renderAll();
            }
        }

        document.getElementById('chatSend').addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

        const clearBtn = document.getElementById('clearChatBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', async () => {
                if (!confirm('Chat messages အားလုံး ဖျက်မလား?')) return;
                await apiPost('/api/chat/clear', {});
                allMessages = {};
                lastId = 0;
                renderAll();
            });
        }

        document.getElementById('closePinned').addEventListener('click', () => {
            document.getElementById('pinnedSection').classList.add('hidden');
        });

        /* ===== Init ===== */
        (async function init() {
            if (myType === 'player') {
                try {
                    const res = await fetch('/api/bettor_profile', { headers: { 'X-CSRFToken': CSRF } });
                    const d = await res.json();
                    if (d.ok) myName = d.account.username;
                    else myName = 'Player';
                } catch(e) { myName = 'Player'; }
            } else {
                myName = 'Owner';
            }
            document.getElementById('senderName').textContent = myName;
            poll();
        })();

        setInterval(poll, 3000);
    </script>
    <script>
        document.querySelectorAll('.ripple').forEach(el => {
            el.addEventListener('pointerdown', (e) => {
                const r = el.getBoundingClientRect();
                el.style.setProperty('--ripple-x', (e.clientX - r.left) + 'px');
                el.style.setProperty('--ripple-y', (e.clientY - r.top) + 'px');
                el.classList.remove('rippling');
                void el.offsetWidth;
                el.classList.add('rippling');
            });
            el.addEventListener('animationend', () => el.classList.remove('rippling'));
        });
    </script>
</body>
</html>
