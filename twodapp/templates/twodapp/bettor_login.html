<!DOCTYPE html>
<html lang="my">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Player Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }
        .login-card h1 { font-size: 1.3rem; font-weight: 800; color: #065f46; margin-bottom: 0.25rem; }
        .login-card p { font-size: 0.8rem; color: #6b7280; margin-bottom: 1.5rem; }
        .field { margin-bottom: 1rem; text-align: left; }
        .field label { font-size: 0.75rem; font-weight: 600; color: #374151; margin-bottom: 0.25rem; display: block; }
        .field input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1.5px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
            box-sizing: border-box;
        }
        .field input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .login-btn:active { transform: scale(0.97); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { color: #dc2626; font-size: 0.8rem; font-weight: 600; margin-top: 0.75rem; display: none; }
    </style>
</head>
<body>
    {% csrf_token %}
    <div class="login-card">
        <div style="font-size:2rem; margin-bottom:0.5rem;">🟢</div>
        <h1>Player Login</h1>
        <p>Account ဖွင့်ထားသည့် Username + Password ထည့်ပါ</p>

        <div class="field">
            <label>Username</label>
            <input id="loginUser" type="text" placeholder="Username" autofocus>
        </div>
        <div class="field">
            <label>Password</label>
            <input id="loginPass" type="password" placeholder="Password">
        </div>

        <button id="loginBtn" class="login-btn">
            <i class="fas fa-sign-in-alt"></i> ဝင်ရောက်ရန်
        </button>
        <div id="loginError" class="error-msg"></div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errEl.textContent = 'Username + Password ထည့်ပါ!';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            errEl.style.display = 'none';

            try {
                const res = await fetch('/api/bettor_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = data.redirect;
                } else {
                    errEl.textContent = data.error || 'Login failed';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ဝင်ရောက်ရန်';
                }
            } catch (e) {
                errEl.textContent = 'Network error';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ဝင်ရောက်ရန်';
            }
        });

        document.getElementById('loginPass').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
