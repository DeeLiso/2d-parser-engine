<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>မှတ်တမ်း — {{ bettor_name }}</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/effects.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            min-height: 100dvh; overscroll-behavior: none;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        }
        .glass-nav {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .num-tag {
            display: inline-block;
            background: rgba(99,102,241,0.2);
            color: #a5b4fc;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 700;
            font-family: Consolas, monospace;
            margin: 1px;
        }
        .num-tag.hit {
            background: rgba(16,185,129,0.3);
            color: #6ee7b7;
        }
        .record-row {
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .record-row:active { background: rgba(255,255,255,0.08); }
        .record-row.canceled { opacity: 0.4; }
    </style>
</head>
<body class="text-white">
    <!-- Glass Navbar -->
    <nav class="glass-nav sticky top-0 z-50 shrink-0">
        <div class="max-w-3xl mx-auto px-2 sm:px-4 h-11 sm:h-12 flex items-center gap-2">
            <a href="/bet/?type=bettor" class="text-white/60 hover:text-white w-8 h-8 flex items-center justify-center shrink-0 transition">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            <span class="font-bold text-xs sm:text-sm truncate"><i class="fas fa-history mr-1 text-indigo-400"></i> မှတ်တမ်း</span>
            <span class="ml-auto text-[10px] font-bold bg-white/10 text-white/50 px-2 py-0.5 rounded-full">{{ count }}</span>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-3 py-3">
        <!-- Header Card -->
        <div class="rounded-xl border border-white/10 bg-white/5 backdrop-blur p-4 mb-3">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-lg shrink-0 border border-indigo-500/30">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div>
                    <div class="text-[10px] text-white/30 font-bold uppercase">Account</div>
                    <div class="font-bold text-white text-lg">{{ bettor_name|default:"—" }}</div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3 mt-3 pt-3 border-t border-white/5">
                <div class="text-center">
                    <div class="text-[9px] text-white/30 font-bold uppercase">စုစုပေါင်း</div>
                    <div id="sumTotal" class="font-bold text-indigo-300 text-sm mt-0.5">0</div>
                </div>
                <div class="text-center">
                    <div class="text-[9px] text-white/30 font-bold uppercase">ကြေး</div>
                    <div id="sumAmount" class="font-bold text-emerald-400 text-sm mt-0.5">0 Ks</div>
                </div>
                <div class="text-center">
                    <div class="text-[9px] text-white/30 font-bold uppercase">ခု</div>
                    <div id="sumCount" class="font-bold text-white/60 text-sm mt-0.5">0</div>
                </div>
            </div>
        </div>

        <!-- Records List -->
        <div id="recordsList"></div>
        <div id="emptyState" class="hidden text-center py-12 text-white/20">
            <i class="fas fa-inbox text-4xl mb-3 block"></i>
            <p class="text-sm font-semibold">မှတ်တမ်း မရှိသေးပါ</p>
        </div>
    </main>

    <script>
        const RECORDS = {{ records_json|safe }};

        function render() {
            const el = document.getElementById('recordsList');
            const empty = document.getElementById('emptyState');

            if (!RECORDS.length) {
                el.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            let totalSales = 0, totalCount = 0;
            el.innerHTML = RECORDS.map(r => {
                const nums = r.numbers || [];
                const cnt = r.count || nums.length || 1;
                const total = cnt * (r.amount || 0);
                const canceled = !!r.is_canceled;
                const cls = canceled ? 'record-row canceled' : 'record-row';

                let status = '<span class="text-[9px] font-bold text-emerald-400 bg-emerald-500/15 px-1.5 py-0.5 rounded-full"><i class="fas fa-check mr-0.5"></i>Active</span>';
                if (canceled) status = '<span class="text-[9px] font-bold text-white/30 bg-white/5 px-1.5 py-0.5 rounded-full"><i class="fas fa-ban mr-0.5"></i>Cancel</span>';
                else if (r.is_error) status = '<span class="text-[9px] font-bold text-red-400 bg-red-500/15 px-1.5 py-0.5 rounded-full"><i class="fas fa-times mr-0.5"></i>Error</span>';

                if (!canceled && !r.is_error) { totalSales += total; totalCount += cnt; }

                const numsHtml = nums.map(n => '<span class="num-tag">' + n + '</span>').join('');

                return `<div class="${cls} rounded-lg px-3 py-2.5 mb-1.5">
                    <div class="flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="text-[10px] text-white/20 font-mono">#${r.id}</span>
                                <span class="font-bold text-sm text-white truncate">${r.bettor_name || '—'}</span>
                            </div>
                            <div class="flex flex-wrap gap-0.5 mb-1.5">${numsHtml || '<span class="text-white/20 text-[10px] italic">—</span>'}</div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="font-bold text-sm ${canceled ? 'text-white/20 line-through' : 'text-white'}">${total.toLocaleString()}</div>
                            <div class="text-[9px] text-white/30">@ ${(r.amount || 0).toLocaleString()} × ${cnt}</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        ${status}
                    </div>
                </div>`;
            }).join('');

            document.getElementById('sumTotal').textContent = totalSales.toLocaleString() + ' Ks';
            document.getElementById('sumAmount').textContent = (RECORDS.filter(r => !r.is_canceled && !r.is_error).reduce((a, r) => a + (r.count || 1) * (r.amount || 0), 0)).toLocaleString() + ' Ks';
            document.getElementById('sumCount').textContent = totalCount + ' ခု';
        }
        render();
    </script>
</body>
</html>
