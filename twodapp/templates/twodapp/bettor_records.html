<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>မှတ်တမ်း — {{ bettor_name }}</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { min-width: 600px; }
        .row-active { background: white; }
        .row-canceled { background: #f9fafb; opacity: 0.6; }
        .row-error { background: #fef2f2; }
        .num-tag { display: inline-block; background: #e0e7ff; color: #3730a3; border-radius: 0.25rem; padding: 0.05rem 0.35rem; font-size: 0.65rem; font-weight: 700; margin: 0.05rem; }
    </style>
</head>
<body class="min-h-screen lg:pl-16">

    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex fixed left-0 top-0 bottom-0 w-16 bg-white border-r border-gray-200 z-40 flex-col items-center py-4 gap-1">
        <a href="/bet/?type=dealer" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" title="Home">
            <i class="fas fa-home text-base"></i>
        </a>
        <a href="/records/" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" title="မှတ်တမ်း">
            <i class="fas fa-list-ol text-base"></i>
        </a>
        <a href="/bet/manage_bettors/" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-emerald-50 hover:text-emerald-600 transition" title="Players">
            <i class="fas fa-user-plus text-base"></i>
        </a>
        <a href="/ledger/" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" title="Ledger">
            <i class="fas fa-th text-base"></i>
        </a>
        <a href="/chat/" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-blue-50 hover:text-blue-600 transition" title="Chat">
            <i class="fas fa-comments text-base"></i>
        </a>
        <a href="/settings/" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-purple-50 hover:text-purple-600 transition" title="Settings">
            <i class="fas fa-cog text-base"></i>
        </a>
    </aside>

    <!-- Mobile Bottom Tab Bar -->
    <div class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 shadow-[0_-2px_12px_rgba(0,0,0,0.06)] lg:hidden" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="flex items-center justify-around px-1">
            <a href="/bet/?type=dealer" class="flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1 text-gray-400">
                <i class="fas fa-home text-[18px]"></i><span class="leading-none">Home</span>
            </a>
            <a href="/records/" class="flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1 text-gray-400">
                <i class="fas fa-list-ol text-[18px]"></i><span class="leading-none">မှတ်တမ်း</span>
            </a>
            <a href="/bet/manage_bettors/" class="flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1 text-gray-400">
                <i class="fas fa-user-plus text-[18px]"></i><span class="leading-none">Players</span>
            </a>
            <a href="/ledger/" class="flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1 text-gray-400">
                <i class="fas fa-th text-[18px]"></i><span class="leading-none">Ledger</span>
            </a>
            <a href="/chat/" class="flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1 text-gray-400">
                <i class="fas fa-comments text-[18px]"></i><span class="leading-none">Chat</span>
            </a>
            <a href="/settings/" class="flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1 text-gray-400">
                <i class="fas fa-cog text-[18px]"></i><span class="leading-none">Settings</span>
            </a>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-12 flex items-center gap-3">
            <a href="/bet/?type=bettor" class="text-white hover:text-indigo-200"><i class="fas fa-arrow-left"></i></a>
            <span class="font-bold text-sm truncate"><i class="fas fa-history mr-1"></i> မှတ်တမ်းစာရင်း</span>
            <span class="ml-auto bg-indigo-500 text-xs px-2 py-0.5 rounded-full">{{ count }}</span>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-4 pb-24 lg:pb-6">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-4 border border-indigo-100">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-lg shrink-0">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div>
                    <div class="text-[11px] text-gray-400 font-semibold">Account</div>
                    <div class="font-bold text-indigo-700 text-lg">{{ bettor_name|default:"—" }}</div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3 mt-3 pt-3 border-t border-gray-100">
                <div class="text-center">
                    <div class="text-[10px] text-gray-400 font-semibold">စုစုပေါင်း</div>
                    <div id="sumTotal" class="font-bold text-gray-800 text-sm">0</div>
                </div>
                <div class="text-center">
                    <div class="text-[10px] text-gray-400 font-semibold">ကြေး</div>
                    <div id="sumAmount" class="font-bold text-green-600 text-sm">0 Ks</div>
                </div>
                <div class="text-center">
                    <div class="text-[10px] text-gray-400 font-semibold">ခု</div>
                    <div id="sumCount" class="font-bold text-gray-800 text-sm">0</div>
                </div>
            </div>
        </div>

        <!-- Desktop Table -->
        <div class="hidden sm:block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="table-scroll">
                <table class="w-full text-xs">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-700">
                            <th class="px-3 py-2 text-left font-bold">#</th>
                            <th class="px-3 py-2 text-left font-bold">Playerအမည်</th>
                            <th class="px-3 py-2 text-left font-bold">ဂဏန်း</th>
                            <th class="px-3 py-2 text-center font-bold">ခု</th>
                            <th class="px-3 py-2 text-right font-bold">ကြေး</th>
                            <th class="px-3 py-2 text-right font-bold">စုစုပေါင်း</th>
                            <th class="px-3 py-2 text-center font-bold">အခြေအနေ</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Mobile Cards -->
        <div id="mobileCards" class="sm:hidden space-y-2"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden text-center py-12 text-gray-400">
            <i class="fas fa-inbox text-4xl mb-3"></i>
            <p class="font-semibold">မှတ်တမ်း မရှိသေးပါ</p>
        </div>
    </div>

    <script>
        const RECORDS = {{ records_json|safe }};

        function render() {
            const body = document.getElementById('recordsBody');
            const mobileCards = document.getElementById('mobileCards');
            const empty = document.getElementById('emptyState');
            const tbl = body.closest('.bg-white');

            if (!RECORDS.length) {
                body.innerHTML = '';
                mobileCards.innerHTML = '';
                if (tbl) tbl.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            if (tbl) tbl.classList.remove('hidden');
            empty.classList.add('hidden');

            let totalSales = 0, totalCount = 0;
            let html = '';
            let cardsHtml = '';

            for (const r of RECORDS) {
                const nums = (r.numbers || []);
                const cnt = r.count || nums.length || 1;
                const total = cnt * (r.amount || 0);
                const canceled = !!r.is_canceled;
                const rowCls = canceled ? 'row-canceled' : r.is_error ? 'row-error' : 'row-active';

                let status = '<span class="inline-block bg-green-100 text-green-700 px-1.5 py-0.5 rounded-full font-bold text-[10px]"><i class="fas fa-check mr-0.5"></i>Active</span>';
                if (canceled) status = '<span class="inline-block bg-gray-200 text-gray-500 px-1.5 py-0.5 rounded-full font-bold text-[10px] line-through"><i class="fas fa-ban mr-0.5"></i>Cancel</span>';
                else if (r.is_error) status = '<span class="inline-block bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full font-bold text-[10px]"><i class="fas fa-times mr-0.5"></i>Error</span>';

                if (!canceled && !r.is_error) { totalSales += total; totalCount += cnt; }

                const numsHtml = nums.map(n => '<span class="num-tag">' + n + '</span>').join('');

                // Desktop table row
                html += '<tr class="' + rowCls + ' border-t border-gray-100 hover:bg-indigo-50/30 transition">' +
                    '<td class="px-3 py-2 text-gray-400 font-mono">#' + r.id + '</td>' +
                    '<td class="px-3 py-2 font-bold text-gray-700">' + (r.bettor_name || '—') + '</td>' +
                    '<td class="px-3 py-2">' + (numsHtml || '<span class="italic text-gray-400">—</span>') + '</td>' +
                    '<td class="px-3 py-2 text-center font-semibold">' + cnt + '</td>' +
                    '<td class="px-3 py-2 text-right text-green-600 font-semibold">' + (r.amount || 0).toLocaleString() + '</td>' +
                    '<td class="px-3 py-2 text-right font-bold ' + (canceled ? 'text-gray-400 line-through' : 'text-gray-800') + '">' + total.toLocaleString() + '</td>' +
                    '<td class="px-3 py-2 text-center">' + status + '</td>' +
                '</tr>';

                // Mobile card
                cardsHtml += '<div class="bg-white rounded-xl border border-gray-200 p-3 ' + (canceled ? 'opacity-50' : '') + '">' +
                    '<div class="flex items-center justify-between mb-2">' +
                        '<span class="text-xs text-gray-400 font-mono">#' + r.id + '</span>' +
                        status +
                    '</div>' +
                    '<div class="flex flex-wrap gap-1 mb-2">' + (numsHtml || '<span class="italic text-gray-400 text-xs">—</span>') + '</div>' +
                    '<div class="flex items-center justify-between text-xs">' +
                        '<span class="text-gray-500">ခု: <b class="text-gray-800">' + cnt + '</b></span>' +
                        '<span class="text-gray-500">ကြေး: <b class="text-green-600">' + (r.amount || 0).toLocaleString() + '</b></span>' +
                        '<span class="font-bold ' + (canceled ? 'text-gray-400 line-through' : 'text-gray-800') + '">' + total.toLocaleString() + ' Ks</span>' +
                    '</div>' +
                '</div>';
            }

            body.innerHTML = html;
            mobileCards.innerHTML = cardsHtml;
            document.getElementById('sumTotal').textContent = totalSales.toLocaleString() + ' Ks';
            document.getElementById('sumAmount').textContent = (RECORDS.filter(r => !r.is_canceled && !r.is_error).reduce((a, r) => a + (r.count || 1) * (r.amount || 0), 0)).toLocaleString() + ' Ks';
            document.getElementById('sumCount').textContent = totalCount + ' ခု';
        }
        render();
    </script>
</body>
</html>
