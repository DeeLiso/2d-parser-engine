<!DOCTYPE html>
{% load static %}
<html lang="my" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ဝင်ရောက်ရန် (Login)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="{% static 'js/security.js' %}" defer></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            animation: fadeUp 0.5s ease-out;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .login-input {
            transition: all 0.2s ease;
        }
        .login-input:focus {
            box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-indigo-800 min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

    <div class="login-card bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="bg-indigo-600 text-white px-6 py-5 text-center">
            <div class="text-3xl mb-1"><i class="fas fa-dice"></i></div>
            <h1 class="text-xl font-bold">2DAD</h1>
            <p class="text-indigo-200 text-sm mt-0.5">မှတ်တမ်းစာရင်း စီမံခန့်ခွဲမှုစနစ်</p>
        </div>

        <form method="post" action="{% url 'login' %}" class="p-6 space-y-4">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-3 py-2">
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    {% for e in form.non_field_errors %}{{ e }}{% endfor %}
                </div>
            {% endif %}

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1"><i class="fas fa-user mr-1 text-indigo-500"></i>အသုံးပြုသူအမည်</label>
                <input type="text" name="username" autofocus required
                       class="login-input w-full p-3 border border-gray-300 rounded-lg outline-none text-sm"
                       placeholder="Username">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1"><i class="fas fa-lock mr-1 text-indigo-500"></i>စကားဝှက်</label>
                <input type="password" name="password" required
                       class="login-input w-full p-3 border border-gray-300 rounded-lg outline-none text-sm"
                       placeholder="Password">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit"
                    class="w-full py-3 rounded-lg text-white font-bold bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 transition transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-300/50">
                <i class="fas fa-sign-in-alt mr-2"></i>ဝင်ရောက်မည်
            </button>
        </form>
    </div>

</body>
</html>
